

services :

  server:
    build: ./server
    container_name: bottle_api
    ports:
      - "5000:80"
    volumes:
      - ./server:/var/www/html
    depends_on:
      - database

  database:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bottle
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
  
  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - database
volumes:
  mysql_data:   